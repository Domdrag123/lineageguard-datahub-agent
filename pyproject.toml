[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "datahub-lineageguard"
version = "0.1.0"
description = "A DataHub-grounded schema-change safety agent"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}

[project.scripts]
lineageguard = "lineageguard.server:main"

[tool.setuptools.packages.find]
include = ["lineageguard*"]

